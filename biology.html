<!DOCTYPE html>
<html>
<head>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/aframevr/aframe-extras@7.1.0/dist/aframe-extras.min.js"></script>
    <title>فصل الأحياء</title>
</head>
<body>
    <a-scene>
        <a-sky color="#9CCC65"></a-sky> 
        <a-plane position="0 0 0" rotation="-90 0 0" width="20" height="20" color="#7CB342"></a-plane>

        <a-sphere position="5 1 -10" radius="0.8" color="#FFEB3B"
            animation="property: position; to: 5 1 0; loop: true; dir: alternate; dur: 6000;"></a-sphere>
        <a-text value="مراقبة الكائنات الحية الدقيقة" width="8" position="0 5 -10" align="center" color="#000000" font="mozillavr"></a-text>

        <a-box position="-8 0.5 0" width="1" height="1" depth="0.1" color="#CCCCCC"
            link="href: index.html; title: العودة للردهة">
            <a-text value="العودة" width="2" position="0 0 0.15" align="center" color="#000000" font="mozillavr"></a-text>
        </a-box>
    </a-scene>
</body>
</html>
