<!DOCTYPE html>
<html>
<head>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/aframevr/aframe-extras@7.1.0/dist/aframe-extras.min.js"></script>
    <title>فصل الفيزياء</title>
</head>
<body>
    <a-scene>
        <a-sky src="space_nebula.jpg"></a-sky> 
        <a-entity sound="src: url(space_ambience.mp3); autoplay: true; loop: true; volume: 0.4"></a-entity>

        <a-sphere position="0 2 -8" radius="1.5" color="#00BCD4"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 15000; easing: linear;"></a-sphere>
        
        <a-text value="الجاذبية والمدارات" width="10" position="0 4 -10" align="center" color="#FFFFFF" font="mozillavr"></a-text>

        <a-box position="-8 0.5 0" width="1" height="1" depth="0.1" color="#CCCCCC"
            link="href: index.html; title: العودة للردهة">
            <a-text value="العودة" width="2" position="0 0 0.15" align="center" color="#000000" font="mozillavr"></a-text>
        </a-box>
    </a-scene>
</body>
</html>
