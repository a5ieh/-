<!DOCTYPE html>
<html>
<head>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/aframevr/aframe-extras@7.1.0/dist/aframe-extras.min.js"></script>
    <title>فصل الرياضيات</title>
</head>
<body>
    <a-scene>
        <a-grid material="color: #666; opacity: 0.3"></a-grid>
        <a-sky color="#222"></a-sky> 

        <a-cone position="0 1.5 -5" radius-bottom="1.5" height="3" color="#3F51B5"
            animation="property: scale; to: 1.5 1.5 1.5; loop: true; dir: alternate; dur: 4000;"></a-cone>
        
        <a-text value="الأشكال الهندسية المتحركة" width="8" position="0 5 -10" align="center" color="#FFFFFF" font="mozillavr"></a-text>

        <a-box position="-8 0.5 0" width="1" height="1" depth="0.1" color="#CCCCCC"
            link="href: index.html; title: العودة للردهة">
            <a-text value="العودة" width="2" position="0 0 0.15" align="center" color="#000000" font="mozillavr"></a-text>
        </a-box>
    </a-scene>
</body>
</html>
